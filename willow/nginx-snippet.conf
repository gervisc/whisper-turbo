# whisper-turbo: Willow/WIS nginx integration
#
# Replace the existing /api/willow location block in your WIS nginx.conf
# with this snippet. It routes STT to whisper-turbo while leaving TTS and
# all other WIS endpoints untouched.
#
# The proxy address (172.17.0.1) is the Docker bridge gateway — it's how
# containers reach services running on the host. If your Docker network
# uses a different gateway, adjust the IP accordingly.
#
# To revert: change proxy_pass back to http://keepalive-wis/api/willow

location /api/willow {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://172.17.0.1:19004/api/willow;
}
